[workspace]
resolver = "2"
members = [
    "core/backup",
    "core/crypto",
    "core/format",
    "core/policy",
    "core/update",
    "tools/nott-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
nott-backup = { path = "core/backup" }
nott-crypto = { path = "core/crypto" }
nott-format = { path = "core/format" }
nott-policy = { path = "core/policy" }
nott-update = { path = "core/update" }
getrandom = "0.4.3"
# Cryptographic implementations are pinned to exact versions
# (docs/adr/0008-signature-suite.md, 0012 and 0013).
libcrux-ed25519 = { version = "=0.0.10", default-features = false }
libcrux-ml-dsa = { version = "=0.0.11", default-features = false, features = ["std", "mldsa87"] }
fips205 = { version = "=0.5.0", default-features = false, features = ["slh-dsa-sha2-256s"] }
libcrux-curve25519 = "=0.0.9"
libcrux-ml-kem = { version = "=0.0.11", default-features = false, features = ["std", "mlkem1024"] }
libcrux-chacha20poly1305 = "=0.0.10"
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
sha3 = "0.10.8"
# The random-number interface fips205 expects.
rand_core = "0.6.4"
# Second implementations, used only to cross-check the first in tests.
ml-dsa = "=0.1.2"
ml-kem = "=0.3.4"
slh-dsa = "=0.1.0"
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }
chacha20poly1305 = "=0.10.1"
second-argon2 = { package = "rust-argon2", version = "=3.0.0", default-features = false }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
sha2 = "0.10.8"
toml = "0.8.19"
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Settings that keep release artifacts identical across build directories
# (docs/adr/0006-build-reproducibility.md).
# Dependencies are optimised even in test builds: hash-based signatures take
# minutes to compute unoptimised, seconds optimised. NottOS's own crates stay
# unoptimised so that debugging and overflow checks keep working.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false
strip = "symbols"
codegen-units = 1
