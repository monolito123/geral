[workspace]
resolver = "2"
members = ["core/crypto", "core/format", "core/policy", "tools/nott-tools"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
nott-crypto = { path = "core/crypto" }
nott-format = { path = "core/format" }
nott-policy = { path = "core/policy" }
getrandom = "0.4.3"
# Cryptographic implementations are pinned to exact versions
# (docs/adr/0008-signature-suite.md).
libcrux-ed25519 = { version = "=0.0.10", default-features = false }
libcrux-ml-dsa = { version = "=0.0.11", default-features = false, features = ["std", "mldsa87"] }
ml-dsa = "=0.1.2"
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
sha2 = "0.10.8"
toml = "0.8.19"
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Settings that keep release artifacts identical across build directories
# (docs/adr/0006-build-reproducibility.md).
[profile.release]
debug = false
strip = "symbols"
codegen-units = 1
