[package]
name = "nott-crypto"
description = "NottOS hybrid signatures: Ed25519 with ML-DSA-87, composed from existing implementations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nott-format.workspace = true
getrandom.workspace = true
fips205.workspace = true
libcrux-curve25519.workspace = true
libcrux-ed25519.workspace = true
libcrux-ml-dsa.workspace = true
libcrux-ml-kem.workspace = true
rand_core.workspace = true
sha2.workspace = true
sha3.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Second, independent implementations of ML-DSA and SLH-DSA, used only to
# cross-check the first ones in tests. They are never linked into anything
# that ships.
ml-dsa.workspace = true
ml-kem.workspace = true
slh-dsa.workspace = true
x25519-dalek.workspace = true

[lints]
workspace = true
